media:
  input: "public/images"
  output: "/images"

content:
  - name: "posts"
    label: "Publicações"
    type: "collection"
    path: "content/posts"
    extension: "md"
    filename: "{year}-{month}-{day}-{slug}"
    fields:
      - name: "title"
        label: "Título"
        type: "string"
      - name: "date"
        label: "Data"
        type: "date"
      - name: "summary"
        label: "Resumo"
        type: "string"
      - name: "blog"
        label: "Blog"
        type: "string"
      - name: "published"
        label: "Publicado"
        type: "boolean"
      - name: "body"
        label: "Conteúdo"
        type: "rich-text"
