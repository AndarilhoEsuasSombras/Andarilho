

<style>
/* NEWSLETTER — CADERNO DE IDEIAS */

body {
  margin: 0;
  background: #f3efe6;
  color: #24241f;
  font-family: Georgia, "Times New Roman", serif;
}

main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 55px 35px 70px;
}

h1, h2 {
  margin: 0;
  color: #24241f;
  font-family: "Playfair Display", Georgia, serif;
  font-size: 36px;
  font-weight: 700;
}

h1 {
  padding-bottom: 15px;
  border-bottom: 1px solid #24241f;
}

main > p {
  margin: 20px 0 30px;
  color: #626d54;
  font-size: 17px;
  line-height: 1.8;
}

form {
  max-width: 700px;
  margin: 35px 0;
  padding: 0;
  background: transparent;
  border: none;
}

form > label {
  display: block;
  margin-bottom: 8px;
  color: #24241f;
  font-size: 15px;
}

input[type="email"] {
  box-sizing: border-box;
  width: 100%;
  margin: 0 0 24px;
  padding: 13px 12px;
  border: 1px solid #c5a77b;
  border-radius: 0;
  background: #fbf9f4;
  color: #24241f;
  font-family: inherit;
  font-size: 15px;
}

fieldset {
  margin: 0 0 20px;
  padding: 16px 18px;
  border: 1px solid #c5a77b;
  background: transparent;
}

legend {
  padding: 0 6px;
  color: #24241f;
  font-size: 16px;
}

fieldset label {
  display: inline-block;
  margin: 8px 15px 8px 0;
  color: #24241f;
  font-size: 15px;
}

input[type="checkbox"] {
  accent-color: #8a513d;
}

form > label:has(input[type="checkbox"]) {
  display: block;
  margin: 18px 0 14px;
  line-height: 1.7;
}

button,
input[type="submit"] {
  padding: 12px 22px;
  border: 1px solid #8a513d;
  border-radius: 0;
  background: #8a513d;
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background .2s, color .2s;
}

button:hover,
input[type="submit"]:hover {
  background: transparent;
  color: #8a513d;
}

input:focus-visible,
button:focus-visible {
  outline: 2px solid #8a513d;
  outline-offset: 3px;
}

@media (max-width: 600px) {
  main {
    padding: 35px 20px 50px;
  }

  h1, h2 {
    font-size: 29px;
  }

  fieldset label {
    display: block;
  }
}
</style>




<section class="newsletter-section">
  <h2>Receba novas ideias</h2>
  <p>
    Receba um aviso por e-mail sempre que um novo texto
    for publicado nas categorias que você escolher.
  </p>

  <form id="newsletter-form">
    <label for="newsletter-email">Seu e-mail</label>
    <input
      type="email"
      id="newsletter-email"
      name="email"
      placeholder="voce@exemplo.com"
      autocomplete="email"
      required
    >

    <fieldset>
      <legend>Quais assuntos você deseja receber?</legend>

      <label>
        <input type="checkbox" name="categories"
          value="filosofia">
        Filosofia
      </label>

      <label>
        <input type="checkbox" name="categories"
          value="literatura">
        Literatura
      </label>

      <label>
        <input type="checkbox" name="categories"
          value="poesia">
        Poesia
      </label>

      <label>
        <input type="checkbox" name="categories"
          value="temas-diversos">
        Temas diversos
      </label>
    </fieldset>

    <label class="newsletter-consent">
      <input type="checkbox" id="newsletter-consent"
        required>
      Aceito receber e-mails sobre novas publicações
      e entendo que posso cancelar a inscrição.
    </label>

    <button type="submit">Inscrever-se</button>
    <p id="newsletter-status" role="status"
      aria-live="polite"></p>
  </form>
</section>

<script>
(() => {
  const form = document.getElementById("newsletter-form");
  const status = document.getElementById("newsletter-status");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("newsletter-email")
      .value.trim();

    const categories = Array.from(
      form.querySelectorAll(
        'input[name="categories"]:checked'
      )
    ).map(input => input.value);

    if (categories.length === 0) {
      status.textContent =
        "Escolha pelo menos uma categoria.";
      return;
    }

    status.textContent = "Enviando inscrição...";

    try {
      const response = await fetch(
        "COLOQUE_AQUI_A_URL_DO_WORKER/subscribe",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, categories })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "Não foi possível concluir a inscrição."
        );
      }

      status.textContent =
        "Inscrição recebida! Obrigado por acompanhar o Caderno de Ideias.";

      form.reset();
    } catch (error) {
      status.textContent =
        "Não foi possível concluir a inscrição. Tente novamente.";
    }
  });
})();
</script>
